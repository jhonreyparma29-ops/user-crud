name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ionic-firestore-crud .

      - name: Stop Existing Container
        shell: powershell
        run: |
          docker stop ionic-firestore-crud-container
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Container not running."
          }

      - name: Remove Existing Container
        shell: powershell
        run: |
          docker rm ionic-firestore-crud-container
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Container does not exist."
          }

      - name: Run Docker Container
        run: docker run -d --name ionic-firestore-crud-container -p 8100:8100 ionic-firestore-crud
<ion-header [translucent]="true">
  <ion-toolbar color="dark">
    <ion-title>Inventory</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="loadGuitars()">
        <ion-icon slot="icon-only" name="refresh-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar color="dark">
    <ion-searchbar
      placeholder="Search brand, model, type"
      [(ngModel)]="searchTerm"
      [ngModelOptions]="{ standalone: true }"
      debounce="200">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="loadGuitars($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-progress-bar *ngIf="loading" type="indeterminate"></ion-progress-bar>

  <ion-item lines="full" class="sort-bar">
    <ion-icon name="funnel-outline" slot="start"></ion-icon>
    <ion-select
      label="Sort by"
      interface="popover"
      [(ngModel)]="sortKey"
      [ngModelOptions]="{ standalone: true }">
      <ion-select-option value="brand">Brand</ion-select-option>
      <ion-select-option value="model">Model</ion-select-option>
      <ion-select-option value="price">Price</ion-select-option>
      <ion-select-option value="stock">Stock</ion-select-option>
      <ion-select-option value="status">Status</ion-select-option>
    </ion-select>
    <ion-button fill="clear" slot="end" (click)="toggleSortDir()">
      <ion-icon
        slot="icon-only"
        [name]="sortDir === 'asc' ? 'arrow-up-outline' : 'arrow-down-outline'">
      </ion-icon>
    </ion-button>
  </ion-item>

  <ion-list>
    <ion-item-sliding *ngFor="let g of displayedGuitars; trackBy: trackById" class="inventory-slide">
      <ion-item class="inventory-item" lines="none">
        <ion-icon name="musical-notes-outline" slot="start" color="primary"></ion-icon>
        <ion-label class="inventory-label ion-text-wrap">
          <div class="title-row">
            <h2>{{ g.brand }} {{ g.model }}</h2>
            <span class="price-tag">&#8369;{{ g.price }}</span>
          </div>

          <div class="meta-row">
            <p>{{ g.type }} &middot; Stock: {{ g.stock }}</p>
            <ion-badge [color]="statusColor(g.status)">{{ g.status }}</ion-badge>
          </div>

          <p class="renter-text" *ngIf="g.status === 'Rented' && g.renter">Rented by: {{ g.renter }}</p>
        </ion-label>

        <ion-buttons slot="end" class="inventory-actions">
          <ion-button color="primary" fill="clear" (click)="openEdit(g)" title="Edit">
            <ion-icon slot="icon-only" name="create-outline"></ion-icon>
          </ion-button>
          <ion-button color="danger" fill="clear" (click)="askDelete(g)" title="Delete">
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="primary" (click)="openEdit(g)">
          <ion-icon slot="icon-only" name="create-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="danger" (click)="askDelete(g)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <div class="empty" *ngIf="!loading && displayedGuitars.length === 0">
    <ion-icon name="musical-note-outline"></ion-icon>
    <p>No guitars yet. Add one from the Add tab.</p>
  </div>

  <ion-modal [isOpen]="isModalOpen" (didDismiss)="closeModal()">
    <ng-template>
      <ion-header>
        <ion-toolbar color="dark">
          <ion-title>Edit Guitar</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="closeModal()">Close</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <ion-list>
          <ion-item>
            <ion-input
              label="Brand *"
              labelPlacement="floating"
              [(ngModel)]="form.brand"
              [ngModelOptions]="{ standalone: true }">
            </ion-input>
          </ion-item>

          <ion-item>
            <ion-input
              label="Model *"
              labelPlacement="floating"
              [(ngModel)]="form.model"
              [ngModelOptions]="{ standalone: true }">
            </ion-input>
          </ion-item>

          <ion-item>
            <ion-select
              label="Type"
              labelPlacement="floating"
              [(ngModel)]="form.type"
              [ngModelOptions]="{ standalone: true }">
              <ion-select-option *ngFor="let t of types" [value]="t">{{ t }}</ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item>
            <ion-input
              label="Daily Rate (PHP) *"
              labelPlacement="floating"
              type="number"
              min="0"
              [(ngModel)]="form.price"
              [ngModelOptions]="{ standalone: true }">
            </ion-input>
          </ion-item>

          <ion-item>
            <ion-input
              label="Stock *"
              labelPlacement="floating"
              type="number"
              min="0"
              [(ngModel)]="form.stock"
              [ngModelOptions]="{ standalone: true }">
            </ion-input>
          </ion-item>

          <ion-item>
            <ion-select
              label="Status"
              labelPlacement="floating"
              [(ngModel)]="form.status"
              [ngModelOptions]="{ standalone: true }">
              <ion-select-option *ngFor="let s of statuses" [value]="s">{{ s }}</ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item *ngIf="form.status === 'Rented'">
            <ion-input
              label="Renter Name"
              labelPlacement="floating"
              [(ngModel)]="form.renter"
              [ngModelOptions]="{ standalone: true }">
            </ion-input>
          </ion-item>
        </ion-list>

        <ion-button
          expand="block"
          class="ion-margin-top"
          [disabled]="loading"
          (click)="updateGuitar()">
          Update
        </ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>

  <ion-alert
    [isOpen]="isConfirmOpen"
    header="Delete guitar?"
    [message]="'This will permanently remove ' + (toDelete?.brand || '') + ' ' + (toDelete?.model || '') + '.'"
    [buttons]="deleteButtons"
    (didDismiss)="isConfirmOpen = false">
  </ion-alert>

  <ion-toast
    [isOpen]="isToastOpen"
    [message]="toastMsg"
    [color]="toastColor"
    [duration]="2000"
    position="bottom"
    (didDismiss)="isToastOpen = false">
  </ion-toast>
</ion-content>
